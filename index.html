<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fontdiner+Swanky&family=Funnel+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Quintessential&family=Roboto:ital,wght@0,100..900;1,100..900&family=Story+Script&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="fontdiner-swanky-regular">
    <h1 id="game-result-popup"></h1>
    <div class="player">
      <input id="player1-name" type="text" placeholder="Player1" style="width: 150px" />
      <img class="token" src="./assests/X.png" alt="X Image" />
    </div>
    <div class="container">
      <div id="title">
        <h1>Tic Tac Toe</h1>
      </div>
      <div id="game-board"></div>
      <button id="restart-btn">Restart</button>
    </div>
    <div class="player">
      <input id="player2-name" type="text" placeholder="Player2" style="width: 150px" />
      <img class="token" src="./assests/O.png" alt="O Image" />
    </div>
    <footer class="attribution">Icons by Freepik - Flaticon</footer>
  </body>
</html>
